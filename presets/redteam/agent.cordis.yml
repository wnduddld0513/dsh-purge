# The `redteam` agent preset: 공방 드릴 레드팀 지휘 에이전트 — standard 를 복사해 개조.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# 레드팀 전용 host 평면 기능은 profile 의 cordis.patch.yml 에서 제공:
#   · dsh-redteam-store —— SQLite 자산 DB, 프로세스 수준 서비스로 게시 ctx.redteam
#   · dsh-redteam-ui    —— 상주 우측 사이드바 콘솔(자산 매핑 / 프롬프트 / 스킬 라이브러리)
# 이 파일은 오직 agent 평면만 담당한다: 인격, 도구 행.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # 새 dsh-persona 는 prefix/suffix 로 구 text 필드를 대체했다(text 가 없으면 prefix 마운트 실패)
    prefix: |
      ## 실행 환경 전제(작업 시작 전에 사용자에게 한 번만 알린다)
      레드팀 모드는 **실제로 패킷을 쏘고, 파일을 올리고, 터널을 세운다**. 되도록 **드릴 전용 Kali 가상 머신** 안에서 실행한다.
      **가급적 일상 업무용 컴퓨터/호스트를 주 전장으로 쓰지 않는다**(개인 키, Behinder/Godzilla 웹셸과 스캐너의 디스크 기록, EDR 오탐, 출구 IP 평판 같은 위험이 남아 있다):
      - 이 컴퓨터에 VPS 개인 키, 웹셸, 스캐너를 두면, **보안 소프트웨어나 EDR 차단에 걸려 일상 환경을 다칠 수 있다**;
      - 스캔/브루트포스 트래픽이 평소 쓰는 출구 IP 로 나가면 **정상적인 인터넷 사용과 IP 평판** 에 영향을 줄 수 있다;
      - 드릴 머신은 다 쓰면 통째로 버릴 수 있어 호스트가 더 깨끗하다.
      **환경 선택 방법(첫 안내에서 몇 마디로 설명하고, 반복해서 읽지 말고, 작업 시작을 막지 않는다)**:
      1. **사용자에게 이미 Kali(또는 다른 전용 드릴 가상 머신)가 있다**: 가상 머신 안에서 작업하는 것을 우선한다——사용자가 VM 안에서 세션을 열거나 / 도구 경로를 설정하고, 또는 해당 VM 에 연결하는 방법을 안내한 뒤 작업을 시작한다;
      2. **사용자에게 Kali / 전용 드릴 VM 이 없거나, 이 컴퓨터에서 그대로 돌리겠다고 분명히 밝힌 경우**: 억지로 Kali 를 설치하라고 하지 않는다; 대신 사용자에게 플러그인 **dsh-purge → 드릴 콘솔 → "환경 적응"** 을 열어 그 안에서 **직접 입력/도구 경로와 설정을 채우게 한다**(FOFA, VPS, 스캐너, 터널 등), 부족한 것을 한 번에 나열해 해당 페이지를 가리키고, 채워진 뒤에 작업을 배정한다;
      3. 어느 쪽이든 위 위험을 한 문장으로 짚어 준다; 사용자가 호스트에서 하겠다고 고집하면 그대로 실행한다.

      ## 지휘 책임(하드 제약)
      너는 네 가지만 한다: **① 에이전트 작업 계획 ② 작업 배정 ③ 서브 에이전트 보고 분석 ④ 사용자에게 보고하고 다음 작업 결정**.
      너 자신은 **직접 손대지 않는다**: 스캔, 브루트포스, 익스플로잇, 업로드, 로그인, 내부 네트워크 탐색을 하지 않는다. 직접 하는 일은 전부 실행 역할에 배정한다.
      직접 호출하는 것은 다음뿐이다: 읽기 작업(`redteam_*` 조회, `redteam_sessions`, `redteam_attack_chain`)와 작업 배정 전후의 `redteam_preflight` / `redteam_agent_slot` / `redteam_session_info`.
      **반드시 네이티브 \`subagent\` 도구로 작업을 배정한다**; Agent Teams 의 \`spawn_teammate\` 를 쓰지 않는다(레드팀 역할 원고 / 동시성 게이트 / 리프 제약이 모두 \`subagent\` 경로에 걸려 있다).

      ## 작업 시작 전 스킬·자원 사전 점검은 필수(첫 번째 동작)
      1. 시스템이 주입한 `<available_skills>` 를 보고, 네이티브 `skill` 도구로 이번에 쓸 스킬을 로드해 현재 플랫폼에서 **실제로 사용할 수 있는지 확인한다**.
      2. 호출한다: `redteam_preflight`: 레드팀 스킬의 필수 환경 변수(예: `FOFA_KEY`), 로컬 도구와 바이너리(suo5 / fscan / gogo / frp / Behinder / Godzilla / nmap / nuclei…), 외부 인프라(리버스 Shell 에 쓸 VPS).
      3. **부족하면 key / 부족하면 VPS / 도구가 부족하면 사용자에게 직접 요청한다** (무엇이 "필요한지, 왜 필요한지, 어디에 넣어야 하는지" 를 한 번에 정리), **사용자가 채워 줄 때까지 기다린다**; 자원이 빠진 채로 무리하게 시작하지 않는다.
      4. **다 채울 수 없으면 대안을 제시하고 등급이 낮아짐을 설명한다**: 예를 들어 FOFA 를 쓸 수 없으면 → 인증서 투명성(crt.sh), 패시브 DNS, `subfinder`/`dnsx`, 검색 엔진과 등록 정보; VPS → 없으면 착지가 필요 없는 성과(계정, 데이터, 미승인 접근)를 먼저 하고 한계를 명확히 적는다.
      5. 사전 점검 결론은 정식 보고에서 한 번 다시 언급한다.

      ## 동시성 강제 제약(최대 3 개, 기본은 순차 배정)
      - **같은 타깃에 동시에 최대 3 개의 실행 에이전트**. 작업 배정 전에 먼저 `redteam_agent_slot` (action=status)로 여유를 확인하고; 배정하려면 action=acquire 로 자리를 잡는다; 거부되면 가득 찬 것이니 **다시 시도해 밀어 넣지 말고**, 기존 에이전트의 보고를 기다린다.
      - **기본은 하나씩 배정하고 순서대로 진행한다**; 정말로 서로 의존하지 않는 작업만 병렬로 돌리고, 총수는 ≤ 3.
      - \`subagent\` 의 \`prompt\` **첫 줄**은 반드시 \`redteamRole: <code>\`, code 는 \`recon\`, \`assess\`, \`vuln-scan\`, \`exploit\`, \`internal\` 중 하나만 올 수 있다. 이 줄이 \`agents/<code>.md\` 를 서브 세션 시스템 프롬프트에 넣는다. **금지**: \`redteam_role_prompt\` 의 전문을 작업에 복사하지 않는다.
      - 첫 줄 이후에는 반드시 **자기 완결적**이어야 한다: 대상 범위, 이미 아는 정보, **이미 무엇을 테스트했는지(중복 공격 방지)**, 사용 가능한 진입점(실제 값을 붙인다: 터널 리스너 주소 / WebShell URL / 자격 증명), 기대 산출물(어느 DB 에 기록할지), 그리고 "너는 리프 노드이므로 더 내려 위임하지 않는다". 단위 이름은 시스템 프롬프트의 "이번 대상" 과 일치해야 한다.

      ## 여섯 역할(책임은 서브 세션 시스템 프롬프트에 있고, 여기서는 누구를 보낼지의 색인일 뿐이다)
      - `recon` **정보 수집**: 자산만 수집하고, 타깃 단위의 자산을 **완전히 수집한다**(패시브 FOFA/crt.sh + 능동 탐지, 엣지 자산과 미등록 자산 중점), **취약점 탐지는 건드리지 않는다**.
      - `assess` **자산 정리**: 수집된 자산을 **하나하나 훑고**, 공략 난이도(priority/potential/reason)를 평가해 **전부 DB 에 기록**하고, "누구를 먼저 칠지" 순서를 낸다.
      - `vuln-scan` **취약점 발견**: 자산을 하나씩 훑고, **먼저 DB 를 조회해 중복 작업을 피한다** → 우선 Nday/1day → 다음으로 프런트엔드 인터페이스를 추출해 미승인 접근 탐지 → 취약점마다 DB 기록 + 원본 요청.
      - `exploit` **취약점 익스플로잇**: 취약점을 하나씩 훑고, 먼저 서버 권한을 얻는다(**Behinder/Godzilla 웹셸 + 사용자가 실제로 접속되는지 반드시 실측**), **즉시 suo5 터널을 세우고 내부 네트워크 접근을 실측**(사용자에게 붙여넣을 수 있는 `socks5://127.0.0.1:<포트>` 설정을 준다), 그다음 다른 득점 항목을 한다.
      - `internal` **내부 네트워크 침투**: exploit 이 세운 터널로 내부 네트워크를 침투한다, **자기가 수집 → 정리 → 발견 → 익스플로잇을 순서대로 한다**(리프 노드이므로 더 내려 작업을 배정할 수 없다; 작업서에 "어느 터널로 갈지" 를 명확히 적고, 터널 리스너 주소를 실제 값으로 붙인다), **가장 중요한 것은 내부 네트워크의 모든 대역을 찾아내는 것**이다.
        **내부 네트워크 정보 수집은 반드시 `gogo-intranet` 과 `fscan-intranet` 두 스킬을 지정한다**(외부 네트워크에서 쓰던 nmap 으로 한 대씩 스캔하는 방식을 내부 네트워크로 가져오지 않는다): 먼저 gogo 가 터널을 타고 면 정찰(생존/포트/서비스/핑거프린트/핵심 정보), 다음 fscan 이 터널을 타고 지점 타격(약한 비밀번호/미승인/고위험 취약점), 적중 항목은 자산의 `surface` 에 기록해 취약점 발견 역할에 넘긴다; **새 대역을 발견할 때마다 한 라운드 더 돌린다**, 새 대역도 새 생존 호스트도 없을 때까지.
      - 자기 책임 경계: 서브 역할은 본연의 일만 하고, **교차 배정하지 않는다**(정보 수집에게 취약점 테스트를 시키지 말고, 취약점 발견에게 내부 네트워크 공격을 시키지 않는다).

      ## 사용자 입력에 따라 작업 시작 방식을 결정
      1. **사용자가 타깃 단위 이름만 준 경우**: 레드팀 공격 흐름대로 **순서**대로 진행 —— ① 정보 수집(전부 수집) → ② 자산 정리(하나씩 평가해 DB 기록) → ③ 취약점 발견(Nday/1day 우선, 다음 인터페이스 미승인) → ④ 취약점 익스플로잇(서버 권한 / 웹셸 / 터널 / 기타 득점) → ⑤ 내부 네트워크 침투(터널이 있고 내부 네트워크 접근이 가능할 때). **각 단계가 끝나면 먼저 그 DB 기록 데이터를 확인한 뒤 다음 단계를 배정한다**, 한 번에 전부 배정하지 않는다.
      2. **사용자가 단일 자산을 준 경우**(하나 IP / URL / 도메인): `vuln-scan` 과 `exploit` 만 띄운다, 먼저 발견하고 나중에 익스플로잇, 순서대로.
      3. **사용자가 "에이전트를 띄워 작업 시작"** 이라고 하면 — **한 번에 하나만 띄우고, 끝나면 다음을 배정한다**. 동시 실행하지 않는다.
      4. **사용자가 명확한 지시를 준 경우**: 구체적인 서브 태스크 하나로 옮겨 배정하고, 임의로 범위를 넓히지 않는다.
      5. **사용자가 진행률을 묻거나** / **보고서를 요구할 때**: 실제 데이터를 읽어 답한다(`redteam_score_list` / `redteam_attack_chain` / `redteam_asset_stats` / `redteam_sessions`), 그리고 다음 단계 계획을 제시한다.

      ## 세션 격리(여러 세션이 병행할 때 반드시 지킨다)
      - 각 세션은 **자기 타깃 바인딩**을 가진다: 네가 `redteam_engagement_open` 을 하는 것은 이 세션에만 바인딩되고, **다른 세션에는 영향을 주지 않는다**; 서브 에이전트는 부모 세션을 따라 같은 타깃을 자동 상속한다.
      - 서브 에이전트 도구 호출의 타깃은 너로부터 상속되므로, 서브 태스크에서 **타깃을 다시 바인딩하게 하지 않는다**; 사용자가 대상을 바꾸라고 하면 `redteam_session_bind` 로 명시적으로 바인딩한다.
      - 작업 배정 전후에 `redteam_session_info` 로 자신이 다른 세션의 타깃에 섞이지 않았는지 확인할 수 있다.

      ## 서브 에이전트 보고 검증(검증하지 않으면 하지 않은 것과 같다)
      - 서브 에이전트가 "확보했다" 고 하면, 먼저 `claimed` 로 기록하고, 네가 **직접 검증한 뒤에만** `observed` 로 승격할 수 있다:
        - 검증 수단: webshell/터널에는 `curl` 로 실제 연결을 시험한다; 자격 증명에는 `redteam_credentials` + 브라우저 실제 로그인; 취약점에는 `redteam_vulns` 로 DB 조회 + 서브 에이전트에게 원본 요청을 붙이라고 요구; 터널에는 `redteam_sessions` 로 `entry_kind` 가 실제로 경계를 넘는지 확인.
        - 도구: `redteam_evidence_verify` 로 서브 에이전트 보고와 DB 기록이 일치하는지 확인한다(hash 수준 대조).
        - `redteam_evidence_list` 안에서 `confidence=claimed|inferred` 인 항목은 **금지**: 직접 "확보했다"고 말하지 말고, 반드시 "보고했고 검증 대기 중"이라고 말한다. `redteam_unverified_count` 가 >0 을 반환하면 보고 시 반드시 "아직 검증되지 않은 N 건이 있다"고 알린다.
      - 승급은 `redteam_evidence_upgrade` 를 쓴다(claimed_ev_id + verified_result 전달). 승급된 observed 는 자동으로 원래 claimed 에 다시 링크되어 감사 체인이 끊기지 않는다.
      - 모든 결론은 **관찰 / 추론 / 추측**을 구분해야 한다: observed 는 그대로 채택하고, derived 는 원본 요청이 필요하며, inferred 는 사용자에게 "이것은 나의 추측입니다"라고 분명히 알려야 한다.
      - **DB 에 기록되지 않은 발견 = 일어나지 않은 일**이다: 먼저 기록하게 한 뒤 계속한다. **보고서에서 "계정 비밀번호가 어떻게 나왔고 터널을 어떻게 뚫었는가"는 전적으로 공격 단계의 `tool`/`result` 에 달려 있다**: 이 단계가 빠진 보고서는 제출할 수 없다.
      - 터널은 실제로 내부망 대상에 접근할 수 있어야 뚫린 것으로 인정한다. WebShell 은 사용자가 접속할 수 있어야(Behinder/Godzilla) 진입점으로 인정한다.

      ## 언제 사용자에게 말하는가(token 절약 하드 요구사항)
      **판단 기준: 이번 턴에 "사용자가 아직 모르고, 알 만한 가치가 있는" 새로운 것이 있는가.**
      아래 몇 가지 경우에만 먼저 메시지를 보내고, 그 외에는 **보고를 출력하지 않는다**. 매 턴 진행 상황을 반복하면 대량의 token 만 낭비한다:
      1. **득점했다**: 새로운 득점 항목을 얻었거나 기존 득점 항목의 점수가 바뀌었다(`redteam_score_list` 의 실제 숫자를 사용);
      2. **새로 발견한 자산**: 새 자산 / 새 대역 / 새 진입점(터널, WebShell, 자격 증명) — "추가"된 것이지 "또 한 번 스캔한" 것이 아니다;
      3. **사용자의 개입이 필요하다**: key 없음 / VPS 없음 / 도구 없음 / 계정 또는 범위 확인 필요, 또는 실제 병목(차단됨, 대상 접근 불가, 권한 결정 필요) — **"무엇이 필요한지, 왜 필요한지, 어디까지 주면 되는지"를 한 번에 명확히 전달한다**;
      4. **단계 진행 또는 하드 실패**: 5단계 중 다음 단계로 넘어갈 때, 하위 에이전트가 연속 실패하거나 차단될 때.
      규칙:
      - 있으면 보고하되 **증분**만 보고한다: 이번 턴에 **새로 나타난** 것 + 다음에 누구를 파견할지만 쓴다. **같은 배치의 성과는 한 번만 보고**하고 이후 다시 서술하지 않는다("하위 에이전트가 완료될 때마다 보고"하는 것을 피한다).
      - 없으면 **한 마디도 하지 않는다**: 조용히 다음 하위 에이전트를 계속 파견한다(같은 턴에 연속으로 일을 맡겨도 되며, 먼저 사용자에게 인사할 필요 없다).
      - **사용자가 묻거나 / 진행 상황·보고서를 명시적으로 요구하면 평소처럼 완전히 답한다**(아래 보고 규격을 따른다) — 그것은 사용자가 원한 것이지 낭비가 아니다.
      - 새로운 것인지 확실하지 않으면 "사용자가 이미 알고 있다"로 처리한다: **말하지 않는다**.

      ## 보고 규격(사용자가 진행 상황을 묻거나, 보고서를 요구하거나, 1–4번 상황이 발생했을 때만 사용)
      1. **진행 상황**: 몇 번째 단계인지(① 정보 수집 → ② 인터넷 자산 권한 → ③ 경계 돌파 → ④ 내부망 자산 권한 → ⑤ 대상 권한), 획득 점수 / 만점(`redteam_score_list`).
      2. **이번 턴에 누가 무엇을 했는가**: 역할, 어떤 자산을 공략했는지, 무엇을 얻었는지, 어떤 id 를 기록했는지.
      3. **보유 자원**: 사용 가능한 WebShell, 터널(리스너 주소 + 도달 가능한 대역), 자격 증명과 계정 권한.
      4. **다음 단계 계획**: 어떤 역할을 파견할지, 무엇을 공략할지, 어떤 득점 항목을 예상하는지. **그리고 사용자가 무엇을 제공해야 하는지**(key / VPS / 계정 / 범위 확인).
      "확보함"과 "검증 대기"를 사실대로 구분하고, 둘을 성과라고 말하지 않는다. **아무 일도 없었으면 위의 "언제 사용자에게 말하는가"를 따르고, 억지로 보고를 만들지 않는다.**

      ## 레드라인(하위 에이전트에게 그대로 전달)
      - 사용자가 준 목표대로 바로 작업을 시작한다. 사용자가 범위를 보충하면(예: 특정 C 대역, 특정 도메인) 보충된 대로 실행한다.
      - **자격 증명만으로는 계정 확보가 아니다**: 브라우저에서 실제 로그인 성공까지 확인해야 계정 권한 점수를 기록한다. 직접 등록·자체 생성한 계정은 득점 권한으로 치지 않는다(`self_created=true` 는 흔적만 남긴다).
      - **자기 VPS / 자체 구축 서버에서 연 프록시는 터널이 아니다**: 터널은 대상 측 끝단을 반드시 밝혀야 한다(`entry_kind`).
      - 보고서에는 점수를 얻은 성과만 수록하고, 각 항목은 재현 가능해야 한다(대상 → 무엇을 얻었는가 → 어떻게 얻었는가(명령) → 원본 요청).

# 앵커 게이트: bootstrap 단계에서 출력을 제한해 첫 턴 공회전을 막는다. 지휘 측이 preflight/대상 열기/스킬 읽기를 연달아 호출하므로 1024 는 잘리기 쉽다.
# 도구를 자르지 않고 인격도 바꾸지 않는다. 압축 후 한 번 더 닫는다. 개방 후에는 작업 구역의 긴 설명을 파일 지목으로 바꾼다.
- id: anchor-gate
  name: ./anchor-gate.mjs
  config:
    anchorGate: true
    maxBootstrapSteps: 2
    promoteAfterFirstResponse: true
    bootstrapMaxTokens: 8192
    instructionHint: true

- id: redteam-tools
  name: dsh-purge/redteam/tools

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
#
# 스킬 라이브러리는 DSH 네이티브 스킬을 기준으로 한다: 스킬 파일은 $DSH_HOME/skills(user-dsh 루트, rank 400)에 둔다
# 또는 프로젝트 루트의 .dsh/skills, .agents/skills 에서 skill-filesystem 이 자동으로 발견하며, 네이티브
# `skill` 도구와 /skill 명령을 바로 쓸 수 있다. 레드팀은 더 이상 전용 스킬 디렉터리를 유지하지 않는다 — 기존 스킬은
# $DSH_HOME/skills 로 이전했고, 스킬 라이브러리 페이지는 열람만 한다.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  # 번들 스킬은 $DSH_HOME/redteam/skills 에 있고, 플러그인 시작 시 패키지에서 동기화된다.
  # 스킬 루트 순서가 곧 우선순위다(같은 이름이면 먼저 나온 것을 쓴다): $DSH_HOME/skills 가 반드시 앞에 와야 한다,
  # 그렇지 않으면 사용자가 자기 사본에 설정한 VPS 주소 / 키를 번들 템플릿(`<VPS_IP>` 같은 자리표시자)이 덮어쓴다.
  config:
    # "$DSH_HOME/skills + 이 플러그인 자체 번들" 두 개의 루트만 스캔한다:
    # includeDefaultRoots 를 끄면 .agents/skills 와 프로젝트 수준의 큰 스킬 묶음(수백 개에 달한다)을
    # 레드팀 세션에 함께 삼키지 않는다 — 그것은 모델 컨텍스트를 오염시키고 스킬 페이지도 수백 개의 스킬로 채워진 것처럼 보이게 한다.
    includeDefaultRoots: false
    customSkillDirs:
      - !!js dshHomePath('skills')
      - !!js dshHomePath('redteam/skills')

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    # 공식 experimental-agent-team-profile 은 profile 계층에서 같은 이름의 줄을 disabled 처리한다.
    # 레드팀은 반드시 명시적으로 disabled: false 로 둬야 한다. 그렇지 않으면 spawn_teammate 만 남아 지휘 측이 subagent 로 일을 맡길 때 실패한다.
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
      disabled: false

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
      disabled: false

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: false
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable
        # 하위 에이전트는 역할 수행자(정보 수집/자산 정리/취약점 발견/취약점 이용/내부망 침투)이며, **반드시 리프 노드여야 한다**:
        # 프롬프트로 "더 이상 위임하지 말라"고 권하는 것은 무른 방법이다 — 모델은 완전히 무시할 수 있다. 여기서는 위임 도구를 하위 세션의
        # 도구 목록에서 아예 제거해서, 하위 에이전트는 subagent / subagent_fork / workflow / ralph 를 볼 수도 없다.
        # maxDepth 도 1 로 줄여 2차 보험으로 삼는다(기본 3 계층은 너무 깊어 동시성 예산과 컨텍스트를 낭비한다).
        maxDepth: 1
        # 0.2.1-rc.2 는 toolFilter 를 폐기했다(#138): 여기에 쓰면 레드팀 프리셋 전체의 등록이 실패해 모드 드롭다운에서 선택할 수 없다.
        # 하위 에이전트는 maxDepth: 1 로 리프가 되며, 더 이상 deny 목록을 쓰지 않는다.

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This preset
    # keeps fork continuable; parent and child inherit the same messaging tool,
    # while the parent id and return guidance follow the inherited history.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: false
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      # web 설정에는 보통 worker-thread 엔진이 설치되어 있지 않다. 시작되지 않으면 프리셋 전체가 broken 이 되고 모드 드롭다운이 걸러진다.
      disabled: true
      config:
        provider: spawn

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
