# dsh-purge bundle patch
#
# 정리 + 드릴 콘솔은 모두 이 플러그인 안에 있습니다 (lib/redteam, presets/redteam, skills/redteam).
# dsh-purge 만 설치하며, 외부 연결이나 다른 레드팀 패키지 link 는 하지 않습니다.

# 이전 독립 레드팀 패키지 행을 끕니다 (사용자가 예전에 dsh-redteam-mode 를 설치한 경우)
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    personaSuffix: ""

# 本体 insert 写在用户层 profile/cordis.patch.yml（postinstall / 演练台自愈补）。
# 这里只改已入队条目的 inject/config。再 insert 一次会 already queued（#152 / #154 / #159）。
- id: dsh-purge
  name: dsh-purge
  inject: [systemPrompt, tools]
  config:
    enabled: true
    autoApplyOnStart: false
    autoUpdateOnStart: false
    autoRevertOnMissing: false
    injectOnce: false
    stripMnemon: true
    verbose: false
    postPrompt: ""
    postPromptOrder: 5100
    autoRetry: true
    retryMax: 3
    autoContinue: false
    continueMax: 3
    continueText: "계속"
    capabilityProtocol: true
    hooksDenyBypass: true

- insert:
    # 드릴 콘솔: 프리셋 + 스킬 적용 (이 플러그인 lib/redteam)
    - id: dsh-purge-redteam
      name: dsh-purge/redteam

    # 드릴 콘솔 사실 저장소 (SQLite), 데이터는 $DSH_HOME/redteam
    - id: dsh-purge-redteam-store
      name: dsh-purge/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # 드릴 콘솔 HTTP 브리지 POST /redteam/api
    - id: dsh-purge-redteam-ui
      name: dsh-purge/redteam/ui
